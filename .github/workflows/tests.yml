name: Python tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out Axral Vocal AI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out VO-SE_vocal parser for integration tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nebula-INE/VO-SE_vocal
          path: VO-SE_vocal
          persist-credentials: false
      - name: Set up Node.js for production Web pitch bridge test
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Install TypeScript for Web bridge characterization
        run: npm install --prefix "$RUNNER_TEMP/axral-typescript" --no-save --no-package-lock --ignore-scripts typescript@5.7.3
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run actual Web pitch bridge probe
        env:
          VO_SE_VOCAL_ROOT: ${{ github.workspace }}/VO-SE_vocal
          AXRAL_NODE_MODULES_ROOT: ${{ runner.temp }}/axral-typescript
        run: node tests/web_pitch_runtime_probe.mjs
      - name: Run unit and production-parser integration tests
        env:
          VO_SE_VOCAL_ROOT: ${{ github.workspace }}/VO-SE_vocal
          AXRAL_NODE_MODULES_ROOT: ${{ runner.temp }}/axral-typescript
        run: python -m pytest -q
