name: Hugging Face UTAU Voicebank Audit

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Hugging Face dataset branch, tag, or commit SHA
        required: false
        default: main
        type: string
      file_path_filter:
        description: Optional case-insensitive substring filter applied to Hub paths before download
        required: false
        default: ""
        type: string
      voicebank_filter:
        description: Optional substring filter for discovered voicebank directories after download
        required: false
        default: ""
        type: string
      max_download_mb:
        description: Maximum selected download size in MiB
        required: true
        default: "4096"
        type: string
      max_extracted_mb:
        description: Maximum total extracted archive size in MiB
        required: true
        default: "8192"
        type: string
      fail_on:
        description: Fail after all banks are audited when findings meet this threshold
        required: true
        default: error
        type: choice
        options:
          - error
          - warning
          - never
      permission_reviewed:
        description: Confirm per-bank terms explicitly allow hosted processing on GitHub Actions
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: read

concurrency:
  group: hf-utau-voicebank-audit-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit VO-US UTAU voicebanks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUDIT_REVISION: ${{ github.event.inputs.revision || 'main' }}
      AUDIT_FILE_FILTER: ${{ github.event.inputs.file_path_filter || '' }}
      AUDIT_FILTER: ${{ github.event.inputs.voicebank_filter || '' }}
      MAX_DOWNLOAD_MB: ${{ github.event.inputs.max_download_mb || '4096' }}
      MAX_EXTRACTED_MB: ${{ github.event.inputs.max_extracted_mb || '8192' }}
      FAIL_ON: ${{ github.event.inputs.fail_on || 'error' }}
    steps:
      - name: Require explicit permission review for hosted processing
        env:
          PERMISSION_REVIEWED: ${{ github.event.inputs.permission_reviewed || 'no' }}
        run: |
          if [ "$PERMISSION_REVIEWED" != "yes" ]; then
            echo "::error::Hosted audit is blocked until you confirm that every selected voicebank permits processing on GitHub Actions."
            exit 1
          fi

      - name: Check out Axral Vocal AI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and Hugging Face client
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "huggingface_hub>=0.30,<2"

      - name: Download and audit VO-US
        id: audit
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/audit_hf_voicebanks.py --repo-id "SEKOIA2900/VO-US" --revision "$AUDIT_REVISION" --file-path-filter "$AUDIT_FILE_FILTER" --voicebank-filter "$AUDIT_FILTER" --max-download-mb "$MAX_DOWNLOAD_MB" --max-extracted-mb "$MAX_EXTRACTED_MB" --fail-on "$FAIL_ON" --output-dir "artifacts/hf-voicebank-audit"

      - name: Upload sanitized audit summary
        if: always() && hashFiles('artifacts/hf-voicebank-audit/summary.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hf-utau-voicebank-audit
          path: |
            artifacts/hf-voicebank-audit/summary.json
            artifacts/hf-voicebank-audit/summary.md
          if-no-files-found: warn
          retention-days: 7

      - name: Apply audit result
        if: always() && steps.audit.outcome == 'failure'
        run: |
          echo "Voicebank audit failed. See the sanitized summary artifact and job summary."
          exit 1
